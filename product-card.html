<!DOCTYPE html>
<html>
<head>
    <title>HTML Product Card</title>
</head>
<body>

    <h1>Product Card</h1>

    <div>

        <h2>Wireless Headphones</h2>

        <img
            src="https://via.placeholder.com/250"
            alt="Wireless Headphones"
            width="250"
            height="200">

        <p>
            Comfortable wireless headphones with clear sound
            and a long-lasting battery.
        </p>

        <p>
            <strong>Price:</strong> ₹1,499
        </p>

        <p>
            <strong>Availability:</strong> In Stock
        </p>

        <button type="button">
            Add to Cart
        </button>

    </div>

</body>
</html>
